name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: README table and INDEX.md are up to date
        run: python3 scripts/build_index.py --check
      - name: Relative links resolve
        run: python3 scripts/check_links.py
